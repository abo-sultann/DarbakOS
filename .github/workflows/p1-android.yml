name: Android compatibility gate

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'mediafixture/**'
      - 'osmandfixture/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/p1-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'mediafixture/**'
      - 'osmandfixture/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/**'
      - '.github/workflows/p1-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Source and safety checks
        run: python3 scripts/check_baseline.py && python3 scripts/p9_gate_check.py

      - name: Provision Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'

      - name: Stabilize ADB before emulator
        run: |
          adb kill-server || true
          rm -f ~/.android/adb*.lock || true
          adb start-server
          adb version

      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :mediafixture:assembleDebug :osmandfixture:assembleDebug :app:lintDebug --no-daemon --console=plain

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: API25 legacy regression floor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86
          ram-size: 1024M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1024x600 -dpi-device 160
          script: mkdir -p test-evidence && python3 scripts/p5_media_smoke.py > test-evidence/p5-runner.log 2>&1 && python3 scripts/p6_vehicle_smoke.py > test-evidence/p6-runner.log 2>&1 && python3 scripts/p7_apps_smoke.py > test-evidence/p7-apps-runner.log 2>&1 && python3 scripts/p7_settings_smoke.py > test-evidence/p7-settings-runner.log 2>&1 && python3 scripts/p7_standby_smoke.py > test-evidence/p7-standby-runner.log 2>&1 && python3 scripts/p8_admin_smoke.py > test-evidence/p8-admin-runner.log 2>&1 && python3 scripts/p8_update_inspection_smoke.py > test-evidence/p8-update-runner.log 2>&1 && python3 scripts/p8_recovery_smoke.py > test-evidence/p8-recovery-runner.log 2>&1

      - name: API37 modern review gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: default
          arch: x86_64
          ram-size: 3072M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1920x1080 -dpi-device 240
          script: |
            set -e
            mkdir -p test-evidence
            python3 scripts/p10_permission_dialog_smoke.py > test-evidence/p10-permission-dialog.log 2>&1
            python3 scripts/p10_media_permission_smoke.py > test-evidence/p10-media-permission.log 2>&1
            # Permission-dialog behavior is proven above. Grant precise location only for the
            # remaining focused instrumentation so system UI cannot obscure unrelated checks.
            adb shell pm grant com.abosultan.darbakos.test android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant com.abosultan.darbakos.test android.permission.ACCESS_FINE_LOCATION
            python3 scripts/p9_modern_display_smoke.py > test-evidence/p10-modern-display.log 2>&1
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -r mediafixture/build/outputs/apk/debug/mediafixture-debug.apk
            adb install -r osmandfixture/build/outputs/apk/debug/osmandfixture-debug.apk
            adb shell appops set com.abosultan.darbakos.test MOCK_LOCATION allow
            adb shell settings put secure enabled_notification_listeners com.abosultan.darbakos.test/com.abosultan.darbakos.MediaNotificationListener
            adb shell am instrument -w -e class com.abosultan.darbakos.ModernHeadUnitTest,com.abosultan.darbakos.LocationPermissionPolicyTest,com.abosultan.darbakos.ModernPermissionPolicyTest,com.abosultan.darbakos.RuntimeStartPolicyTest,com.abosultan.darbakos.StartupCoordinatorTest,com.abosultan.darbakos.PositionFreshnessTest,com.abosultan.darbakos.TripStorageFailoverTest,com.abosultan.darbakos.MediaStoreAudioScannerTest,com.abosultan.darbakos.OsmAndVisibilityIntegrationTest com.abosultan.darbakos.test.test/androidx.test.runner.AndroidJUnitRunner > test-evidence/p10-review-tests.log 2>&1
            ! grep -q 'FAILURES!!!' test-evidence/p10-review-tests.log
            grep -Eq 'OK \([0-9]+ tests?\)' test-evidence/p10-review-tests.log
            adb shell am instrument -w -e class com.abosultan.darbakos.P4GpsTripTest,com.abosultan.darbakos.PositionStateTest,com.abosultan.darbakos.TripRecorderTest,com.abosultan.darbakos.TripPersistenceTest,com.abosultan.darbakos.MediaSnapshotTest,com.abosultan.darbakos.LocalMediaIntegrationTest com.abosultan.darbakos.test.test/androidx.test.runner.AndroidJUnitRunner > test-evidence/p10-portable-services.log 2>&1
            ! grep -q 'FAILURES!!!' test-evidence/p10-portable-services.log

      - name: Upload TEST APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarbakOS-compatibility-${{ github.sha }}
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            mediafixture/build/outputs/apk/debug/*.apk
            osmandfixture/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            test-evidence/
